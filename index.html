<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield: Forensic-Grade Stealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; }
    .glass { background: #111; border: 1px solid #333; }
  </style>
</head>
<body class="p-6 flex flex-col items-center">
  <div class="max-w-4xl w-full glass p-8 rounded-3xl shadow-2xl">
    <h1 class="text-3xl font-bold text-center text-cyan-400 mb-6">AuraShield: Ultimate Stealth Engine</h1>
    <div id="dropzone" class="border-2 border-dashed border-gray-600 p-12 rounded-2xl text-center cursor-pointer hover:border-cyan-500">
      <p>Upload Photo for Forensic Resampling</p>
      <input type="file" id="fileInput" class="hidden">
    </div>
    <div class="mt-6 flex flex-col items-center">
      <div id="status" class="text-xs font-mono text-gray-400">Ready</div>
      <canvas id="canvas" class="hidden mt-4"></canvas>
      <a id="downloadBtn" class="hidden mt-6 bg-cyan-600 py-3 px-10 rounded-full font-bold">Download Pro-Edited HD</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn'), status = document.getElementById('status');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processStealth(e.target.files[0]);

    async function processStealth(file) {
      status.innerText = "Initializing Professional Resampling...";
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      // Setup High-Res Canvas
      const w = Math.min(img.width, 2500), h = Math.min(img.height, 2500);
      canvas.width = w; canvas.height = h;

      // 1. Perspective Shear (Breaks Diffusion Grid)
      ctx.transform(1, 0.002, 0.002, 1, 0, 0); 
      ctx.drawImage(img, 0, 0, w, h);

      // 2. Luminance Sharp (Color Safe)
      const d = ctx.getImageData(0,0,w,h), data = d.data, copy = new Uint8ClampedArray(data);
      for (let i = 0; i < data.length; i+=4) {
         let diff = ((copy[i]+copy[i+1]+copy[i+2])/3 - (copy[i-4]+copy[i+4])/2) * 0.2;
         data[i]+=diff; data[i+1]+=diff; data[i+2]+=diff;
      }
      ctx.putImageData(d, 0, 0);

      // 3. Double Pass JPEG to Kill Latent Signature
      status.innerText = "Executing Advanced Quantization...";
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
      const blobUrl = URL.createObjectURL(blob);
      const img2 = new Image();
      img2.src = blobUrl;
      await img2.decode();
      ctx.drawImage(img2, 0, 0);

      // 4. Inject Comprehensive Metadata
      const final = injectProEXIF(canvas.toDataURL('image/jpeg', 1.0));
      
      downloadBtn.href = final;
      downloadBtn.download = "human_edited_pro.jpg";
      downloadBtn.classList.remove('hidden');
      document.getElementById('canvas').classList.remove('hidden');
      status.innerText = "Completed: Forensic Signature Stripped.";
    }

    function injectProEXIF(data) {
      const zer = {
        [piexif.ImageIFD.Make]: "Canon",
        [piexif.ImageIFD.Model]: "Canon EOS R5",
        [piexif.ImageIFD.Software]: "Adobe Photoshop 2024.1 (Windows)",
        [piexif.ImageIFD.DateTime]: "2026:08:11 18:00:00"
      };
      const exi = {
        [piexif.ExifIFD.LensModel]: "RF50mm F1.2 L USM",
        [piexif.ExifIFD.FNumber]: [14, 10],
        [piexif.ExifIFD.ISOSpeedRatings]: 100,
        [piexif.ExifIFD.DateTimeOriginal]: "2026:08:11 18:00:00"
      };
      const gps = { [piexif.GPSIFD.GPSLatitudeRef]: "N", [piexif.GPSIFD.GPSLatitude]: [[23, 1], [42, 1], [0, 100]] };
      return piexif.insert(piexif.dump({"0th": zer, "Exif": exi, "GPS": gps}), data);
    }
  </script>
</body>
</html>
