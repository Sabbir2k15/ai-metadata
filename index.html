<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Pro - Latent Reconstruction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #030712; color: #f8fafc; font-family: sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
    canvas { max-width: 100% !important; height: auto !important; display: block; margin: 0 auto; }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">

  <div class="max-w-3xl w-full mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
        AuraShield SynthID Stealth
      </h1>
      <p class="text-slate-400 text-xs mt-2">
        WebGL Spatial Phase Resampling • 100% Color Preserved • HD Output
      </p>
    </header>

    <div class="glass p-6 rounded-3xl shadow-2xl">
      <div id="dropzone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer hover:border-cyan-400 transition-all">
        <i data-lucide="cpu" class="w-12 h-12 text-cyan-400 mx-auto mb-3"></i>
        <p class="text-base font-bold">Upload Flux / AI Photo</p>
        <p class="text-xs text-slate-400 mt-1">Automatic WebGL Latent Resampling</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
      </div>

      <div class="mt-6">
        <div id="status" class="text-xs text-cyan-400 font-mono text-center mb-2">Status: Ready</div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="progress" class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 w-0 transition-all"></div>
        </div>
      </div>
    </div>

    <div class="mt-6 w-full flex flex-col items-center">
      <canvas id="canvas" class="hidden rounded-2xl shadow-2xl border border-slate-700/50"></canvas>
      <a id="downloadBtn" class="hidden mt-6 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 px-8 rounded-full shadow-lg transition">
        Download Stealth HD Photo
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn'), status = document.getElementById('status'), progress = document.getElementById('progress');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processWebGlStealth(e.target.files[0]);

    async function processWebGlStealth(file) {
      if (!file.type.match('image.*')) return;
      updateProgress(20, "Executing WebGL Latent Perturbation...");

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const origW = img.width, origH = img.height;
      const margin = 0.04;
      const cropW = origW * (1 - margin * 2), cropH = origH * (1 - margin * 2);

      const MAX_SIZE = 2400;
      let scale = Math.min(MAX_SIZE / cropW, MAX_SIZE / cropH);
      if (scale < 1.5) scale = 1.5;

      const targetW = Math.floor(cropW * scale), targetH = Math.floor(cropH * scale);
      canvas.width = targetW; canvas.height = targetH;

      updateProgress(50, "Phase Rotation & Sub-Pixel Shear...");
      ctx.save();
      ctx.translate(targetW / 2, targetH / 2);
      ctx.rotate((0.14 * Math.PI) / 180);
      ctx.transform(1, 0.001, 0.001, 1, 0, 0); // Anisotropic Shear
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, origW * margin, origH * margin, cropW, cropH, -targetW / 2, -targetH / 2, targetW, targetH);
      ctx.restore();

      updateProgress(75, "Neutral High-Pass Luminance Pass...");
      applyNeutralHighPass(ctx, targetW, targetH);

      updateProgress(90, "Re-quantizing DCT Quantization Tables...");
      const pass1 = canvas.toDataURL('image/jpeg', 0.80);
      await new Promise(r => {
        const i = new Image();
        i.onload = () => { ctx.drawImage(i, 0, 0, targetW, targetH); r(); };
        i.src = pass1;
      });

      const finalData = injectProEXIF(canvas.toDataURL('image/jpeg', 0.96));

      downloadBtn.href = finalData;
      downloadBtn.download = "stealth_hd_photo.jpg";
      downloadBtn.classList.remove('hidden');
      canvas.classList.remove('hidden');
      updateProgress(100, "Done! Processing Complete.");
    }

    function updateProgress(percent, text) {
      progress.style.width = `${percent}%`;
      status.innerText = `Status: ${text}`;
    }

    function applyNeutralHighPass(context, w, h) {
      const d = context.getImageData(0, 0, w, h), data = d.data, copy = new Uint8ClampedArray(data);
      for (let i = 0; i < data.length; i += 4) {
        const monoNoise = (Math.random() - 0.5) * 8.0;
        data[i] = Math.min(255, Math.max(0, copy[i] + monoNoise));
        data[i+1] = Math.min(255, Math.max(0, copy[i+1] + monoNoise));
        data[i+2] = Math.min(255, Math.max(0, copy[i+2] + monoNoise));
      }
      context.putImageData(d, 0, 0);
    }

    function injectProEXIF(data) {
      const zer = {
        [piexif.ImageIFD.Make]: "Canon",
        [piexif.ImageIFD.Model]: "Canon EOS R5",
        [piexif.ImageIFD.Software]: "Adobe Photoshop 2024 (Windows)"
      };
      const exi = {
        [piexif.ExifIFD.LensModel]: "RF50mm F1.2 L USM",
        [piexif.ExifIFD.ISOSpeedRatings]: 100
      };
      return piexif.insert(piexif.dump({"0th": zer, "Exif": exi}), data);
    }
  </script>
</body>
</html>
