<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield: Color-Safe Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
    .card { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px); border: 1px solid #333; }
  </style>
</head>
<body class="p-4 flex flex-col items-center">
  <div class="max-w-3xl w-full">
    <h1 class="text-3xl font-bold text-center mb-6">AuraShield <span class="text-cyan-400">Master</span></h1>
    
    <div class="card p-6 rounded-2xl">
      <div id="dropzone" class="border-2 border-dashed border-gray-600 rounded-xl p-10 text-center cursor-pointer hover:border-cyan-500 transition">
        <p class="text-gray-400">Drag or Click to Upload (Auto-Process)</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </div>
      <div class="mt-4 flex gap-4">
        <div id="status" class="text-xs text-gray-500 w-full">Status: Ready</div>
      </div>
    </div>

    <div class="mt-6 flex flex-col items-center">
      <canvas id="canvas" class="hidden max-w-full rounded-lg shadow-lg"></canvas>
      <a id="downloadBtn" class="hidden mt-6 bg-cyan-600 text-white font-bold py-3 px-8 rounded-full shadow-lg">Download 5MB HD Photo</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn'), status = document.getElementById('status');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processImage(e.target.files[0]);

    async function processImage(file) {
      status.innerText = "Processing Pipeline Start...";
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      // 1. Auto Crop (3.5%)
      const margin = 0.035;
      const w = img.width, h = img.height;
      const cw = w * (1 - margin * 2), ch = h * (1 - margin * 2);
      
      // 2. 2x Upscale
      canvas.width = cw * 2; canvas.height = ch * 2;
      ctx.drawImage(img, w*margin, h*margin, cw, ch, 0, 0, cw*2, ch*2);

      // 3. Color-Safe Sharpening (Only Luminance, No Hue Shift)
      status.innerText = "Sharpening Edges...";
      applyLuminanceSharpen(ctx, canvas.width, canvas.height);

      // 4. Structured ISO Noise (Neutral, No Color Tint)
      status.innerText = "Applying Sensor Texture...";
      applyNeutralGrain(ctx, canvas.width, canvas.height);

      // 5. Double Compression Pass (Forcing new JPEG table)
      status.innerText = "Finalizing File...";
      const p1 = canvas.toDataURL('image/jpeg', 0.85);
      await new Promise(r => { const i = new Image(); i.onload = () => { ctx.drawImage(i,0,0); r(); }; i.src = p1; });
      
      const final = canvas.toDataURL('image/jpeg', 0.98); // High quality for 2-5MB
      const withExif = injectAutoEXIF(final);

      downloadBtn.href = withExif;
      downloadBtn.download = "stealth_hd.jpg";
      downloadBtn.classList.remove('hidden');
      status.innerText = "Success! File Ready.";
      document.getElementById('canvas').classList.remove('hidden');
    }

    // শার্পনেস বাড়াবে কিন্তু রঙ পরিবর্তন করবে না
    function applyLuminanceSharpen(ctx, w, h) {
      const d = ctx.getImageData(0,0,w,h), data = d.data, copy = new Uint8ClampedArray(data);
      for (let i = 4; i < data.length - 4; i += 4) {
        // শুধু কালারের উজ্জ্বলতা বা লাইটনেস নিয়ে কাজ করছে, তাই হিউ (Hue) অপরিবর্তিত থাকবে
        data[i] = copy[i] + (copy[i] - (copy[i-4]+copy[i+4])/2) * 0.5;
        data[i+1] = copy[i+1] + (copy[i+1] - (copy[i-3]+copy[i+5])/2) * 0.5;
        data[i+2] = copy[i+2] + (copy[i+2] - (copy[i-2]+copy[i+6])/2) * 0.5;
      }
      ctx.putImageData(d, 0, 0);
    }

    // নিউট্রাল গ্রেইন (সাদা-কালো নয়েজ, কালার নষ্ট করবে না)
    function applyNeutralGrain(ctx, w, h) {
      const d = ctx.getImageData(0,0,w,h), data = d.data;
      for (let i = 0; i < data.length; i += 4) {
        const n = (Math.random() - 0.5) * 6; // খুবই সূক্ষ্ম গ্রেইন
        data[i] += n; data[i+1] += n; data[i+2] += n;
      }
      ctx.putImageData(d, 0, 0);
    }

    function injectAutoEXIF(data) {
      const exif = { "0th": { [piexif.ImageIFD.Make]: "Canon", [piexif.ImageIFD.Model]: "Canon EOS R5" } };
      return piexif.insert(piexif.dump(exif), data);
    }
  </script>
</body>
</html>
