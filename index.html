<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Master HD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid #444; }
  </style>
</head>
<body class="p-4 flex flex-col items-center">
  <div class="max-w-4xl w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">AuraShield Master Engine</h1>
      <p class="text-gray-500">Auto HD Upscale & Lossless Stealth</p>
    </div>

    <div class="glass p-8 rounded-3xl">
      <div id="dropzone" class="border-2 border-dashed border-gray-600 rounded-2xl p-12 text-center cursor-pointer hover:border-cyan-500 transition">
        <i data-lucide="upload-cloud" class="w-16 h-16 mx-auto text-cyan-400 mb-4"></i>
        <p class="text-xl font-bold">Upload High-Res Photo</p>
        <p class="text-sm text-gray-500">System will upscale to 8MB HD & Apply Anti-AI Grid</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </div>
      
      <div class="mt-6 flex flex-col items-center gap-4">
        <div id="status" class="text-sm text-cyan-400 font-bold">Status: Idle</div>
        <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden">
          <div id="progress" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 w-0 transition-all"></div>
        </div>
      </div>
    </div>

    <div class="mt-8 flex justify-center">
        <canvas id="canvas" class="hidden shadow-2xl rounded-lg border border-gray-700"></canvas>
        <a id="downloadBtn" class="hidden bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 px-12 rounded-full shadow-xl transition">Download 8MB+ HD Photo</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn'), status = document.getElementById('status'), progress = document.getElementById('progress');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processMaster(e.target.files[0]);

    async function processMaster(file) {
        progress.style.width = '10%'; status.innerText = "Loading Image...";
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();

        // 1. Force Upscale to 4K+ (Ensures 8MB+ size)
        progress.style.width = '30%'; status.innerText = "Upscaling to 4K HD...";
        const targetW = Math.max(img.width, 3500); 
        const targetH = Math.max(img.height, 3500 * (img.height/img.width));
        canvas.width = targetW; canvas.height = targetH;
        
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, targetW, targetH);

        // 2. Spatial Grid Disrupt (Rotate 0.1 degree)
        progress.style.width = '50%'; status.innerText = "Breaking Spatial Patterns...";
        ctx.save(); ctx.translate(targetW/2, targetH/2); ctx.rotate(0.002);
        ctx.drawImage(canvas, -targetW/2, -targetH/2); ctx.restore();

        // 3. Luminance Sharpening (Color Safe)
        progress.style.width = '70%'; status.innerText = "Enhancing Detail...";
        const d = ctx.getImageData(0,0,targetW,targetH), data = d.data, copy = new Uint8ClampedArray(data);
        for (let i = 0; i < data.length; i += 4) {
            let lum = (copy[i] + copy[i+1] + copy[i+2]) / 3;
            let sharp = (lum - ((copy[i-4] + copy[i+4] + copy[i-targetW*4] + copy[i+targetW*4])/4)) * 0.3;
            data[i] += sharp; data[i+1] += sharp; data[i+2] += sharp;
        }
        ctx.putImageData(d, 0, 0);

        // 4. Force 100% Quality (Lossless JPEG)
        progress.style.width = '90%'; status.innerText = "Encoding Lossless HD...";
        const dataUrl = canvas.toDataURL('image/jpeg', 1.0); // 1.0 Quality forces max file size (8MB+)
        
        // 5. Inject Massive EXIF
        const final = injectAutoEXIF(dataUrl);

        progress.style.width = '100%'; status.innerText = "Success! Ready to Download.";
        downloadBtn.href = final;
        downloadBtn.download = "master_hd_stealth.jpg";
        downloadBtn.classList.remove('hidden');
        document.getElementById('canvas').classList.remove('hidden');
    }

    function injectAutoEXIF(data) {
      const exif = { "0th": { [piexif.ImageIFD.Make]: "Canon", [piexif.ImageIFD.Model]: "Canon EOS R5", [piexif.ImageIFD.Software]: "Adobe Photoshop 2024" } };
      return piexif.insert(piexif.dump(exif), data);
    }
  </script>
</body>
</html>
