<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraShield Pro — macOS Sonoma Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pica/9.0.1/pica.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #2e0854, transparent 50%),
                  radial-gradient(circle at 80% 80%, #004d40, transparent 50%),
                  linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .macos-window {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }

    .macos-menubar {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .macos-input {
      background: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
      transition: all 0.2s ease;
    }

    .macos-input:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25) !important;
      outline: none !important;
    }

    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    canvas {
      max-width: 100% !important;
      height: auto !important;
      max-height: 38vh;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen relative antialiased selection:bg-cyan-500 selection:text-black">

  <!-- macOS Top Menu Bar -->
  <header class="macos-menubar w-full px-4 py-1.5 flex items-center justify-between text-xs text-slate-300 select-none z-50">
    <div class="flex items-center gap-4">
      <span class="font-bold text-white flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 170 170">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.74 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.6-7.77-11.72-14.18-6.1-9.46-10.9-20.24-14.4-32.35-3.5-12.11-5.25-23.77-5.25-34.98 0-14.15 3.6-25.96 10.8-35.43 7.2-9.47 16.3-14.28 27.3-14.43 4.8 0 10.3 1.25 16.5 3.75 6.2 2.5 10.2 3.8 12 3.9 1.4-.1 5.7-1.4 12.8-3.9 7.1-2.5 12.8-3.7 17.1-3.6 12.2.6 22 4.9 29.4 12.9-10.7 6.5-16 15.5-16 27 0 9.8 3.8 17.9 11.4 24.3 7.6 6.4 16.6 10 27 10.8-2.3 6.9-5.1 13.9-8.4 21zm-24.8-106.9c0-6.7 2.4-12.8 7.2-18.3 4.8-5.5 10.9-9.1 18.2-10.8.6 6.7-1.6 13-6.6 18.9-5 5.9-11.3 9.4-18.8 10.2z"/>
        </svg>
        <span>AuraShield</span>
      </span>
      <span class="hover:text-white cursor-pointer transition">File</span>
      <span class="hover:text-white cursor-pointer transition">Edit</span>
      <span class="hover:text-white cursor-pointer transition">Image</span>
      <span class="hover:text-white cursor-pointer transition">Metadata</span>
      <span class="hover:text-white cursor-pointer transition">View</span>
      <span class="hover:text-white cursor-pointer transition">Help</span>
    </div>

    <div class="flex items-center gap-3">
      <span class="flex items-center gap-1.5"><i data-lucide="wifi" class="w-3.5 h-3.5"></i></span>
      <span class="flex items-center gap-1.5"><i data-lucide="battery-charging" class="w-4 h-4 text-emerald-400"></i> 100%</span>
      <span id="macosClock" class="font-medium text-slate-200"></span>
    </div>
  </header>

  <!-- Main macOS Application Window -->
  <main class="relative z-10 flex-1 max-w-6xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
    
    <div class="macos-window rounded-2xl overflow-hidden">
      
      <!-- macOS Window Titlebar -->
      <div class="px-4 py-3 bg-slate-900/60 border-b border-white/10 flex items-center justify-between select-none">
        <div class="flex items-center gap-2">
          <span class="traffic-light bg-[#ff5f56] border border-[#e0443e]"></span>
          <span class="traffic-light bg-[#ffbd2e] border border-[#dea123]"></span>
          <span class="traffic-light bg-[#27c93f] border border-[#1aab29]"></span>
        </div>
        
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
          <i data-lucide="folder-lock" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span>AuraShield Master HD — Native Inspector & EXIF Suite</span>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-white/10 text-slate-300">1:1 Raw Master</span>
        </div>
      </div>

      <!-- App Content Body -->
      <div class="p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Panel: Dropzone & Settings -->
        <div class="lg:col-span-7 flex flex-col gap-5">
          
          <!-- Dropzone styled as macOS Finder File Target -->
          <div id="dropzone" class="border-2 border-dashed border-slate-600/80 hover:border-cyan-400 rounded-xl p-6 text-center cursor-pointer bg-slate-900/40 transition-all flex flex-col items-center justify-center min-h-[140px] group">
            <input type="file" id="fileInput" accept="image/*" class="hidden" />
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 p-2.5 text-white mb-2 shadow-lg group-hover:scale-105 transition-transform flex items-center justify-center">
              <i data-lucide="image-plus" class="w-6 h-6"></i>
            </div>
            <p class="text-sm font-semibold text-slate-100">Drop Master Photo or Browse</p>
            <p class="text-xs text-slate-400 mt-0.5">Pixel-Level Fidelity • Complete Metadata Preservation</p>
          </div>

          <!-- Presets Segmented Bar -->
          <div class="bg-slate-900/50 p-3 rounded-xl border border-white/10 space-y-2">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-400"></i> Presets
            </span>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <button onclick="applyPreset('clean')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 flex items-center justify-center gap-1.5 transition active:scale-95">
                <i data-lucide="eraser" class="w-3.5 h-3.5 text-red-400"></i> Strip All
              </button>
              <button onclick="applyPreset('social')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 flex items-center justify-center gap-1.5 transition active:scale-95">
                <i data-lucide="share-2" class="w-3.5 h-3.5 text-cyan-400"></i> iOS Social
              </button>
              <button onclick="applyPreset('marketplace')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 flex items-center justify-center gap-1.5 transition active:scale-95">
                <i data-lucide="shopping-cart" class="w-3.5 h-3.5 text-emerald-400"></i> Marketplace
              </button>
              <button onclick="applyPreset('pro_camera')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 flex items-center justify-center gap-1.5 transition active:scale-95">
                <i data-lucide="camera" class="w-3.5 h-3.5 text-purple-400"></i> Canon R5
              </button>
            </div>
          </div>

          <!-- Metadata Properties Inspector -->
          <div class="bg-slate-900/50 p-4 rounded-xl border border-white/10 space-y-3">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i data-lucide="sliders" class="w-3.5 h-3.5 text-blue-400"></i> Inspector Fields
            </span>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Camera Make</label>
                <input type="text" id="exifMake" value="Canon" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Camera Model</label>
                <input type="text" id="exifModel" value="Canon EOS R5" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Author / Studio</label>
                <input type="text" id="exifArtist" value="Master Studio Pro" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Copyright</label>
                <input type="text" id="exifCopyright" value="© 2026 All Rights Reserved" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Software</label>
                <input type="text" id="exifSoftware" value="Adobe Photoshop 2026 (macOS)" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">Timestamp</label>
                <input type="text" id="exifDate" value="2026:08:18 18:51:00" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">GPS Latitude</label>
                <input type="text" id="exifLat" value="23.7104" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-slate-400 mb-1 font-medium">GPS Longitude</label>
                <input type="text" id="exifLng" value="90.4074" class="macos-input w-full px-3 py-2 rounded-lg text-xs">
              </div>
            </div>
          </div>

        </div>

        <!-- Right Panel: Canvas & Actions -->
        <div class="lg:col-span-5 flex flex-col gap-5">
          
          <div class="bg-slate-950/60 rounded-xl border border-white/10 p-3 flex flex-col items-center justify-center min-h-[250px] relative overflow-hidden">
            <div id="previewPlaceholder" class="text-center text-slate-500 py-12">
              <i data-lucide="image" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
              <p class="text-xs font-semibold">Native Canvas Preview</p>
            </div>
            <canvas id="canvas" class="hidden rounded-lg shadow-xl border border-white/10"></canvas>
          </div>

          <div class="bg-slate-900/50 p-4 rounded-xl border border-white/10 space-y-3.5">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400 font-medium">Core Status:</span>
              <span id="fileSizeTag" class="font-mono font-semibold text-cyan-400">Ready</span>
            </div>

            <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-white/5">
              <div id="bar" class="h-full bg-cyan-500 w-0 transition-all duration-300"></div>
            </div>

            <button id="processBtn" onclick="processMasterHD()" class="w-full py-3 rounded-xl font-bold text-white text-xs bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 shadow-lg shadow-blue-500/20 active:scale-98 transition flex items-center justify-center gap-2 cursor-pointer">
              <i data-lucide="cpu" class="w-4 h-4"></i> Export Master Clarity & Inject EXIF
            </button>

            <a id="downloadBtn" class="hidden w-full py-3 rounded-xl font-bold text-white text-center text-xs bg-emerald-600 hover:bg-emerald-500 shadow-lg shadow-emerald-600/20 active:scale-98 transition flex items-center justify-center gap-2 cursor-pointer">
              <i data-lucide="download" class="w-4 h-4"></i> Download Master File (.jpg)
            </a>
          </div>

        </div>

      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();

    // Live macOS Menubar Clock
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
      document.getElementById('macosClock').innerText = now.toLocaleString('en-US', options);
    }
    updateClock();
    setInterval(updateClock, 1000);

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const fileSizeTag = document.getElementById('fileSizeTag');
    const bar = document.getElementById('bar');

    let loadedImage = null;
    let rawFileName = "master_photo";

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.match('image.*')) return;
      rawFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "master_photo";
      
      const reader = new FileReader();
      reader.onload = (e) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          previewPlaceholder.classList.add('hidden');
          canvas.classList.remove('hidden');
          
          canvas.width = loadedImage.width;
          canvas.height = loadedImage.height;

          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(loadedImage, 0, 0);

          fileSizeTag.innerText = `Native: ${loadedImage.width}x${loadedImage.height}`;
          bar.style.width = "25%";
        };
        loadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function applyPreset(type) {
      if (type === 'clean') {
        document.getElementById('exifMake').value = "";
        document.getElementById('exifModel').value = "";
        document.getElementById('exifArtist').value = "";
        document.getElementById('exifCopyright').value = "";
        document.getElementById('exifSoftware').value = "";
        document.getElementById('exifDate').value = "";
        document.getElementById('exifLat').value = "0";
        document.getElementById('exifLng').value = "0";
      } else if (type === 'social') {
        document.getElementById('exifMake').value = "Apple";
        document.getElementById('exifModel').value = "iPhone 15 Pro Max";
        document.getElementById('exifSoftware').value = "iOS 17.5";
        document.getElementById('exifArtist').value = "Creator Studio";
      } else if (type === 'marketplace') {
        document.getElementById('exifMake').value = "Sony";
        document.getElementById('exifModel').value = "ILCE-7RM5";
        document.getElementById('exifSoftware').value = "Capture One 23";
        document.getElementById('exifCopyright').value = "Verified Studio Seller";
      } else if (type === 'pro_camera') {
        document.getElementById('exifMake').value = "Canon";
        document.getElementById('exifModel').value = "Canon EOS R5";
        document.getElementById('exifSoftware').value = "Adobe Photoshop 2026 (macOS)";
        document.getElementById('exifArtist').value = "Master Studio Pro";
      }
    }

    async function processMasterHD() {
      if (!loadedImage) {
        alert("Please select an image first!");
        return;
      }

      try {
        fileSizeTag.innerText = "Extracting Native Matrix...";
        bar.style.width = "50%";

        canvas.width = loadedImage.width;
        canvas.height = loadedImage.height;

        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;

        ctx.drawImage(loadedImage, 0, 0);

        fileSizeTag.innerText = "Encoding Lossless EXIF...";
        bar.style.width = "80%";

        const masterJpegBase64 = canvas.toDataURL('image/jpeg', 1.00);
        const finalMasterJpeg = buildAndInjectEXIF(masterJpegBase64);

        const stringLength = finalMasterJpeg.length - 'data:image/jpeg;base64,'.length;
        const sizeInBytes = 4 * Math.ceil(stringLength / 3) * 0.5624896334383612;
        const sizeInMb = (sizeInBytes / (1024 * 1024)).toFixed(2);

        bar.style.width = "100%";
        fileSizeTag.innerText = `Master: ~${sizeInMb} MB (${loadedImage.width}x${loadedImage.height})`;

        downloadBtn.href = finalMasterJpeg;
        downloadBtn.download = `${rawFileName}_master_hd.jpg`;
        downloadBtn.classList.remove('hidden');

      } catch (err) {
        console.error(err);
        fileSizeTag.innerText = "Pipeline Error";
      }
    }

    function degToRational(deg) {
      const absolute = Math.abs(deg);
      const degrees = Math.floor(absolute);
      const minutesNotTruncated = (absolute - degrees) * 60;
      const minutes = Math.floor(minutesNotTruncated);
      const seconds = Math.floor((minutesNotTruncated - minutes) * 60 * 100);

      return [
        [degrees, 1],
        [minutes, 1],
        [seconds, 100]
      ];
    }

    function buildAndInjectEXIF(cleanBase64Jpeg) {
      const zer = {};
      const exif = {};
      const gps = {};

      const make = document.getElementById('exifMake').value.trim();
      const model = document.getElementById('exifModel').value.trim();
      const artist = document.getElementById('exifArtist').value.trim();
      const copyright = document.getElementById('exifCopyright').value.trim();
      const software = document.getElementById('exifSoftware').value.trim();
      const dateStr = document.getElementById('exifDate').value.trim();
      const lat = parseFloat(document.getElementById('exifLat').value) || 0;
      const lng = parseFloat(document.getElementById('exifLng').value) || 0;

      if (make) zer[piexif.ImageIFD.Make] = make;
      if (model) zer[piexif.ImageIFD.Model] = model;
      if (software) zer[piexif.ImageIFD.Software] = software;
      if (artist) zer[piexif.ImageIFD.Artist] = artist;
      if (copyright) zer[piexif.ImageIFD.Copyright] = copyright;

      if (dateStr) {
        exif[piexif.ExifIFD.DateTimeOriginal] = dateStr;
        exif[piexif.ExifIFD.DateTimeDigitized] = dateStr;
      }

      if (lat !== 0 || lng !== 0) {
        gps[piexif.GPSIFD.GPSLatitudeRef] = lat >= 0 ? "N" : "S";
        gps[piexif.GPSIFD.GPSLatitude] = degToRational(lat);
        gps[piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? "E" : "W";
        gps[piexif.GPSIFD.GPSLongitude] = degToRational(lng);
      }

      const exifObj = { "0th": zer, "Exif": exif, "GPS": gps };
      const exifBytes = piexif.dump(exifObj);
      
      return piexif.insert(exifBytes, cleanBase64Jpeg);
    }
  </script>
</body>
</html>
