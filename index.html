<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Master HD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(15px); border: 1px solid #444; }
    /* Canvas Responsive Fix */
    canvas { max-width: 100% !important; height: auto !important; display: block; margin: 0 auto; }
  </style>
</head>
<body class="p-4 flex flex-col items-center">
  <div class="max-w-3xl w-full">
    <div class="glass p-8 rounded-3xl shadow-2xl">
      <h1 class="text-2xl font-bold text-center mb-6">AuraShield <span class="text-cyan-400">Master</span></h1>
      
      <div id="dropzone" class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-cyan-500 transition">
        <i data-lucide="upload-cloud" class="w-12 h-12 mx-auto text-cyan-400 mb-2"></i>
        <p class="text-sm">Click to Upload HD Photo</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </div>
      
      <div class="mt-6">
        <div id="status" class="text-xs text-cyan-400 text-center mb-2">Status: Ready</div>
        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
          <div id="progress" class="h-full bg-cyan-500 w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>

    <!-- Preview Container -->
    <div class="mt-6 w-full flex flex-col items-center">
        <canvas id="canvas" class="hidden rounded-lg shadow-xl border border-gray-800"></canvas>
        <a id="downloadBtn" class="hidden mt-6 bg-cyan-600 text-white font-bold py-3 px-8 rounded-full shadow-lg">Download HD Stealth Photo</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn'), status = document.getElementById('status'), progress = document.getElementById('progress');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processMaster(e.target.files[0]);

    async function processMaster(file) {
        progress.style.width = '20%'; status.innerText = "Processing...";
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();

        // Limit size to 2500px for browser stability, keeps HD quality
        const MAX_SIZE = 2500; 
        let scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height);
        if (scale > 2) scale = 2; // Upscale logic
        
        const targetW = Math.floor(img.width * scale);
        const targetH = Math.floor(img.height * scale);
        
        canvas.width = targetW; canvas.height = targetH;
        ctx.drawImage(img, 0, 0, targetW, targetH);

        // Apply Spatial Grid Disrupt
        ctx.save(); ctx.rotate(0.002); ctx.drawImage(canvas, 0, 0); ctx.restore();

        // Sharpen & Grain
        const d = ctx.getImageData(0,0,targetW,targetH), data = d.data, copy = new Uint8ClampedArray(data);
        for (let i = 0; i < data.length; i += 4) {
            let n = (Math.random() - 0.5) * 5;
            data[i] += n; data[i+1] += n; data[i+2] += n;
        }
        ctx.putImageData(d, 0, 0);

        progress.style.width = '100%'; status.innerText = "Done!";
        
        // Export high quality (1.0 = Max Size)
        const final = injectAutoEXIF(canvas.toDataURL('image/jpeg', 1.0));
        
        downloadBtn.href = final;
        downloadBtn.download = "stealth_hd.jpg";
        downloadBtn.classList.remove('hidden');
        document.getElementById('canvas').classList.remove('hidden');
    }

    function injectAutoEXIF(data) {
      const exif = { "0th": { [piexif.ImageIFD.Make]: "Canon", [piexif.ImageIFD.Model]: "Canon EOS R5" } };
      return piexif.insert(piexif.dump(exif), data);
    }
  </script>
</body>
</html>
