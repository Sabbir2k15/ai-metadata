<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Pro - Humanizing Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #030712; color: #f8fafc; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    canvas { max-width: 100% !important; height: auto !important; display: block; margin: 0 auto; }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">

  <div class="max-w-3xl w-full mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent">
        AuraShield Deep Humanizer
      </h1>
      <p class="text-slate-400 text-xs md:text-sm mt-2">
        Target Score: 20-30% AI • 100% Original Hue Preserved • HD Output
      </p>
    </header>

    <div class="glass-card p-6 rounded-3xl shadow-2xl">
      <div id="dropzone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer hover:border-cyan-400 transition-all text-center">
        <i data-lucide="cpu" class="w-12 h-12 text-cyan-400 mb-3"></i>
        <p class="text-base font-bold text-slate-200">Click or Drag Photo</p>
        <p class="text-xs text-slate-400 mt-1">Multi-Layer Grid Destruction & Resampling</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
      </div>

      <div class="mt-6">
        <div id="status" class="text-xs text-cyan-400 text-center font-mono mb-2">Status: Ready</div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="progress" class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>

    <!-- Preview Container -->
    <div class="mt-6 w-full flex flex-col items-center">
      <canvas id="canvas" class="hidden rounded-2xl shadow-2xl border border-slate-700/50"></canvas>
      <a id="downloadBtn" class="hidden mt-6 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3.5 px-8 rounded-full shadow-lg hover:opacity-95 transition">
        Download Humanized HD Photo
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    dropzone.onclick = () => fileInput.click();
    fileInput.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('border-cyan-400'); };
    fileInput.ondragleave = () => dropzone.classList.remove('border-cyan-400');
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-cyan-400');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    };

    fileInput.onchange = (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    };

    async function handleFile(file) {
      if (!file.type.match('image.*')) return;
      const rawFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "humanized_photo";
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();
      
      runHumanizePipeline(img, rawFileName);
    }

    async function runHumanizePipeline(img, fileName) {
      updateProgress(10, "Cropping 4% Edge Grid...");

      const origW = img.width;
      const origH = img.height;
      const margin = 0.04; // 4% Crop

      const cropX = Math.floor(origW * margin);
      const cropY = Math.floor(origH * margin);
      const cropW = origW - (cropX * 2);
      const cropH = origH - (cropY * 2);

      // Target Resolution Limit (Max 2400px for Browser Stability)
      const MAX_SIZE = 2400;
      let scale = Math.min(MAX_SIZE / cropW, MAX_SIZE / cropH);
      if (scale < 1.5) scale = 1.5;

      const targetW = Math.floor(cropW * scale);
      const targetH = Math.floor(cropH * scale);

      canvas.width = targetW;
      canvas.height = targetH;

      // 1. Perspective Micro-Warp (Shatters Rectilinear Grid Signature)
      updateProgress(35, "Shattering FFT Frequency Map...");
      ctx.save();
      ctx.translate(targetW / 2, targetH / 2);
      ctx.rotate((0.15 * Math.PI) / 180);
      ctx.scale(1.002, 0.998); // Anisotropic stretch
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, cropX, cropY, cropW, cropH, -targetW / 2, -targetH / 2, targetW, targetH);
      ctx.restore();

      // 2. Luminance-Only Unsharp Mask (Zero Color Shift)
      updateProgress(60, "Enhancing Natural Edge Contrast...");
      applyLuminanceSharpen(ctx, targetW, targetH);

      // 3. Multi-Channel Sensor ISO Texture
      updateProgress(80, "Injecting Real Sensor Noise...");
      applyNeutralSensorGrain(ctx, targetW, targetH);

      // 4. Double Compression Quantization Pass
      updateProgress(90, "Re-quantizing DCT Coefficients...");
      const pass1Data = canvas.toDataURL('image/jpeg', 0.82);
      
      await new Promise((resolve) => {
        const pass1Img = new Image();
        pass1Img.onload = () => {
          ctx.drawImage(pass1Img, 0, 0, targetW, targetH);
          resolve();
        };
        pass1Img.src = pass1Data;
      });

      // 5. Final Export & EXIF Injection
      const finalJpegData = canvas.toDataURL('image/jpeg', 0.95);
      const finalImage = injectAutoEXIF(finalJpegData);

      downloadBtn.href = finalImage;
      downloadBtn.download = `${fileName}_humanized.jpg`;
      downloadBtn.classList.remove('hidden');
      document.getElementById('canvas').classList.remove('hidden');
      updateProgress(100, "Done! Humanized Photo Ready.");
    }

    function updateProgress(percent, text) {
      progress.style.width = `${percent}%`;
      status.innerText = `Status: ${text}`;
    }

    // Color-Safe Sharpening
    function applyLuminanceSharpen(context, w, h) {
      const imgData = context.getImageData(0, 0, w, h);
      const data = imgData.data;
      const copy = new Uint8ClampedArray(data);
      const w4 = w * 4;

      for (let i = w4 + 4; i < data.length - w4 - 4; i += 4) {
        const centerL = (copy[i] + copy[i+1] + copy[i+2]) / 3;
        const surroundL = (
          ((copy[i - 4] + copy[i - 3] + copy[i - 2]) / 3) +
          ((copy[i + 4] + copy[i + 5] + copy[i + 6]) / 3) +
          ((copy[i - w4] + copy[i - w4 + 1] + copy[i - w4 + 2]) / 3) +
          ((copy[i + w4] + copy[i + w4 + 1] + copy[i + w4 + 2]) / 3)
        ) / 4;

        const diff = (centerL - surroundL) * 0.5;

        data[i] = Math.min(255, Math.max(0, copy[i] + diff));
        data[i+1] = Math.min(255, Math.max(0, copy[i+1] + diff));
        data[i+2] = Math.min(255, Math.max(0, copy[i+2] + diff));
      }
      context.putImageData(imgData, 0, 0);
    }

    // Neutral Monochrome ISO Grain
    function applyNeutralSensorGrain(context, w, h) {
      const imgData = context.getImageData(0, 0, w, h);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const monoNoise = (Math.random() - 0.5) * 7.5; 
        data[i] = Math.min(255, Math.max(0, data[i] + monoNoise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + monoNoise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + monoNoise));
      }
      context.putImageData(imgData, 0, 0);
    }

    // Camera EXIF Profile
    function injectAutoEXIF(jpegDataUrl) {
      const zeroth = {};
      const exif = {};

      const now = new Date();
      const dateStr = `${now.getFullYear()}:${String(now.getMonth()+1).padStart(2,'0')}:${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

      zeroth[piexif.ImageIFD.Make] = "Canon";
      zeroth[piexif.ImageIFD.Model] = "Canon EOS R5";
      zeroth[piexif.ImageIFD.Software] = "Digital Photo Professional 4.15";
      
      exif[piexif.ExifIFD.LensModel] = "RF50mm F1.2 L USM";
      exif[piexif.ExifIFD.FNumber] = [14, 10];
      exif[piexif.ExifIFD.ISOSpeedRatings] = 100;
      exif[piexif.ExifIFD.DateTimeOriginal] = dateStr;

      const exifObj = { "0th": zeroth, "Exif": exif };
      const exifBytes = piexif.dump(exifObj);
      return piexif.insert(exifBytes, jpegDataUrl);
    }
  </script>
</body>
</html>
