<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Master - HD Stealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #02040a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-gradient { background: linear-gradient(135deg, #6366f1, #a855f7); transition: 0.3s; }
  </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto">
  <header class="text-center mb-8">
    <h1 class="text-4xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">AuraShield Master Engine</h1>
    <p class="text-slate-400 text-sm">2x Upscale + Spatial Crop + Anti-AI Signature Removal</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: Controls -->
    <div class="glass-panel p-6 rounded-3xl">
      <div id="dropzone" class="border-2 border-dashed border-slate-600 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-cyan-400 transition-all text-center">
        <i data-lucide="upload-cloud" class="w-10 h-10 text-cyan-400 mb-2"></i>
        <p class="font-bold text-sm">Upload Photo</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
      </div>
      
      <div class="mt-8 space-y-3">
        <h3 class="text-xs font-bold text-slate-500 uppercase">Pipeline Status</h3>
        <div id="steps" class="space-y-2">
            <div class="flex justify-between text-xs p-2 bg-slate-800 rounded"><span>Spatial & Crop</span> <span id="s1" class="text-slate-500">Wait</span></div>
            <div class="flex justify-between text-xs p-2 bg-slate-800 rounded"><span>2x HD Upscale</span> <span id="s2" class="text-slate-500">Wait</span></div>
            <div class="flex justify-between text-xs p-2 bg-slate-800 rounded"><span>Optical Effects</span> <span id="s3" class="text-slate-500">Wait</span></div>
            <div class="flex justify-between text-xs p-2 bg-slate-800 rounded"><span>Double Compression</span> <span id="s4" class="text-slate-500">Wait</span></div>
            <div class="flex justify-between text-xs p-2 bg-slate-800 rounded"><span>EXIF Inject</span> <span id="s5" class="text-slate-500">Wait</span></div>
        </div>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="lg:col-span-2 glass-panel p-6 rounded-3xl flex flex-col items-center">
        <canvas id="canvas" class="hidden rounded-xl shadow-2xl max-h-[500px]"></canvas>
        <div id="placeholder" class="py-20 text-slate-600 text-center">
            <i data-lucide="image" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
            <p>Upload a photo to start HD processing</p>
        </div>
        <a id="downloadBtn" class="hidden btn-gradient mt-6 w-full py-4 rounded-xl font-bold text-center text-white">Download HD Stealth Photo</a>
    </div>
  </div>
</div>

<script>
    lucide.createIcons();
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput'), dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn');

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    async function handleFile(file) {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();
        runMasterPipeline(img, file.name);
    }

    async function runMasterPipeline(img, fileName) {
        const updateStep = (id, text) => { document.getElementById(id).innerText = text; document.getElementById(id).className = "text-emerald-400 font-bold"; };
        
        // 1. Crop
        updateStep('s1', 'Done');
        const margin = 0.035, w = img.width, h = img.height;
        const cx = w*margin, cy = h*margin, cw = w*(1-margin*2), ch = h*(1-margin*2);

        // 2. Upscale (2x)
        updateStep('s2', 'Done');
        canvas.width = cw * 2; canvas.height = ch * 2;
        ctx.drawImage(img, cx, cy, cw, ch, 0, 0, cw * 2, ch * 2);

        // 3. Optical Effects (Sharpen, Aberration, Vignette)
        updateStep('s3', 'Done');
        applySharpen(ctx, canvas.width, canvas.height);
        applyAberration(ctx, canvas.width, canvas.height);
        applyVignette(ctx, canvas.width, canvas.height);

        // 4. Double Compression
        updateStep('s4', 'Done');
        const pass1 = canvas.toDataURL('image/jpeg', 0.85);
        const pass2 = await new Promise(r => { 
            const i = new Image(); i.onload = () => { ctx.drawImage(i,0,0); r(canvas.toDataURL('image/jpeg', 0.98)); }; i.src = pass1; 
        });

        // 5. EXIF
        updateStep('s5', 'Done');
        const final = injectAutoEXIF(pass2);

        downloadBtn.href = final;
        downloadBtn.download = fileName.split('.')[0] + "_hd_real.jpg";
        downloadBtn.classList.remove('hidden');
        document.getElementById('placeholder').classList.add('hidden');
        canvas.classList.remove('hidden');
    }

    function applySharpen(ctx, w, h) {
        const d = ctx.getImageData(0,0,w,h), data = d.data, copy = new Uint8ClampedArray(data);
        for (let i = w*4 + 4; i < data.length - w*4 - 4; i += 4) {
            for (let j=0; j<3; j++) data[i+j] = copy[i+j]*5 - copy[i-4+j] - copy[i+4+j] - copy[i-w*4+j] - copy[i+w*4+j];
        }
        ctx.putImageData(d, 0, 0);
    }

    function applyAberration(ctx, w, h) {
        const d = ctx.getImageData(0,0,w,h), data = d.data, copy = new Uint8ClampedArray(data);
        for(let i=0; i<data.length; i+=4) { data[i] = copy[i+4] || copy[i]; data[i+2] = copy[i-4] || copy[i]; }
        ctx.putImageData(d, 0, 0);
    }

    function applyVignette(ctx, w, h) {
        const grad = ctx.createRadialGradient(w/2, h/2, w*0.3, w/2, h/2, w*0.7);
        grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
    }

    function injectAutoEXIF(data) {
        const exif = { "0th": { [piexif.ImageIFD.Make]: "Canon", [piexif.ImageIFD.Model]: "Canon EOS R5" } };
        return piexif.insert(piexif.dump(exif), data);
    }
</script>
</body>
</html>
