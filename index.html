<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraShield Pro — Safe Ultra-HD Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 20% 20%, #2e0854, transparent 50%),
                  radial-gradient(circle at 80% 80%, #004d40, transparent 50%),
                  linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
      color: #f3f4f6;
      min-height: 100vh;
    }

    .macos-window {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
    }

    .macos-input {
      background: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
    }

    .macos-input:focus {
      border-color: #38bdf8 !important;
      outline: none !important;
    }

    .traffic-light {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    canvas {
      max-width: 100% !important;
      height: auto !important;
      max-height: 35vh;
      object-fit: contain;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased">

  <header class="w-full px-4 py-1.5 flex items-center justify-between text-xs text-slate-300 border-b border-white/10 bg-slate-950/60">
    <div class="flex items-center gap-3 font-semibold text-white">
      <span>AuraShield Master Pro</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i> Memory-Safe Ultra Engine</span>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col justify-center">
    <div class="macos-window rounded-2xl overflow-hidden">
      
      <!-- Titlebar -->
      <div class="px-4 py-3 bg-slate-900/80 border-b border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="traffic-light bg-[#ff5f56]"></span>
          <span class="traffic-light bg-[#ffbd2e]"></span>
          <span class="traffic-light bg-[#27c93f]"></span>
        </div>
        <span class="text-xs font-semibold text-slate-300">Ultra-HD Master Upscaler & EXIF Suite</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">8K Max Ready</span>
      </div>

      <div class="p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- Left Panel -->
        <div class="lg:col-span-7 flex flex-col gap-4">
          <div id="dropzone" class="border-2 border-dashed border-slate-600 hover:border-cyan-400 rounded-xl p-5 text-center cursor-pointer bg-slate-900/40 transition-all flex flex-col items-center justify-center min-h-[120px]">
            <input type="file" id="fileInput" accept="image/*" class="hidden" />
            <i data-lucide="upload-cloud" class="w-7 h-7 text-cyan-400 mb-1"></i>
            <p class="text-sm font-semibold text-slate-100">Upload Image</p>
            <p class="text-[11px] text-slate-400">Memory-Safe 8K Ultra-HD Processing</p>
          </div>

          <!-- Presets -->
          <div class="grid grid-cols-4 gap-2">
            <button onclick="applyPreset('clean')" class="py-1.5 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 transition">Strip</button>
            <button onclick="applyPreset('social')" class="py-1.5 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 transition">Social</button>
            <button onclick="applyPreset('marketplace')" class="py-1.5 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 transition">Market</button>
            <button onclick="applyPreset('pro_camera')" class="py-1.5 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 border border-white/5 transition">DSLR</button>
          </div>

          <!-- Form Fields -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <label class="block text-slate-400 mb-0.5">Camera Make</label>
              <input type="text" id="exifMake" value="Canon" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
            <div>
              <label class="block text-slate-400 mb-0.5">Camera Model</label>
              <input type="text" id="exifModel" value="Canon EOS R5 Ultra" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
            <div>
              <label class="block text-slate-400 mb-0.5">Author</label>
              <input type="text" id="exifArtist" value="Studio Master" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
            <div>
              <label class="block text-slate-400 mb-0.5">Software</label>
              <input type="text" id="exifSoftware" value="Adobe Photoshop 2026" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
            <div>
              <label class="block text-slate-400 mb-0.5">Date</label>
              <input type="text" id="exifDate" value="2026:08:18 18:55:00" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
            <div>
              <label class="block text-slate-400 mb-0.5">GPS Latitude</label>
              <input type="text" id="exifLat" value="23.7104" class="macos-input w-full px-2.5 py-1.5 rounded-lg">
            </div>
          </div>
        </div>

        <!-- Right Panel -->
        <div class="lg:col-span-5 flex flex-col gap-4">
          <div class="bg-slate-950/60 rounded-xl border border-white/10 p-3 flex flex-col items-center justify-center min-h-[200px]">
            <div id="previewPlaceholder" class="text-center text-slate-500 py-8">
              <i data-lucide="image" class="w-8 h-8 mx-auto mb-1 opacity-30"></i>
              <p class="text-xs">Preview Window</p>
            </div>
            <canvas id="canvas" class="hidden rounded-lg"></canvas>
          </div>

          <div class="space-y-3">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400">Status:</span>
              <span id="fileSizeTag" class="font-mono text-cyan-400">Ready</span>
            </div>

            <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
              <div id="bar" class="h-full bg-cyan-500 w-0 transition-all duration-300"></div>
            </div>

            <button id="processBtn" onclick="processSafeUltraHD()" class="w-full py-2.5 rounded-xl font-bold text-white text-xs bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 transition cursor-pointer">
              Render Ultra-HD & Inject EXIF
            </button>

            <a id="downloadBtn" class="hidden w-full py-2.5 rounded-xl font-bold text-white text-center text-xs bg-emerald-600 hover:bg-emerald-500 transition block cursor-pointer">
              Download Ultra-HD (.jpg)
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const previewPlaceholder = document.getElementById('previewPlaceholder'), fileSizeTag = document.getElementById('fileSizeTag'), bar = document.getElementById('bar');

    let loadedImage = null, rawFileName = "master_photo";

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    };

    function handleFile(file) {
      if (!file.type.match('image.*')) return;
      rawFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "master_photo";
      const reader = new FileReader();
      reader.onload = (e) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          previewPlaceholder.classList.add('hidden');
          canvas.classList.remove('hidden');
          canvas.width = loadedImage.width;
          canvas.height = loadedImage.height;
          ctx.drawImage(loadedImage, 0, 0);
          fileSizeTag.innerText = `Original: ${loadedImage.width}x${loadedImage.height}`;
          bar.style.width = "20%";
        };
        loadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function applyPreset(type) {
      if (type === 'clean') {
        document.getElementById('exifMake').value = "";
        document.getElementById('exifModel').value = "";
        document.getElementById('exifArtist').value = "";
        document.getElementById('exifSoftware').value = "";
      } else if (type === 'social') {
        document.getElementById('exifMake').value = "Apple";
        document.getElementById('exifModel').value = "iPhone 15 Pro Max";
        document.getElementById('exifSoftware').value = "iOS 17.5";
      } else if (type === 'marketplace') {
        document.getElementById('exifMake').value = "Sony";
        document.getElementById('exifModel').value = "ILCE-7RM5";
        document.getElementById('exifSoftware').value = "Capture One 23";
      } else if (type === 'pro_camera') {
        document.getElementById('exifMake').value = "Canon";
        document.getElementById('exifModel').value = "Canon EOS R5";
        document.getElementById('exifSoftware').value = "Adobe Photoshop 2026";
      }
    }

    async function processSafeUltraHD() {
      if (!loadedImage) {
        alert("Please upload an image first!");
        return;
      }

      try {
        fileSizeTag.innerText = "Processing Safe 4K/8K Matrix...";
        bar.style.width = "40%";

        const origW = loadedImage.width, origH = loadedImage.height;
        
        // Memory-safe limit: Max 4096px (Protects mobile from Aw Snap crash)
        const MAX_SAFE_DIM = 4096;
        let scale = Math.min(MAX_SAFE_DIM / origW, MAX_SAFE_DIM / origH);
        if (scale > 2.0) scale = 2.0;
        if (scale < 1.0) scale = 1.0;

        const targetW = Math.floor(origW * scale), targetH = Math.floor(origH * scale);

        canvas.width = targetW;
        canvas.height = targetH;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(loadedImage, 0, 0, targetW, targetH);

        fileSizeTag.innerText = "Reconstructing Pixel Clarity...";
        bar.style.width = "75%";

        applySafeSharpness(ctx, targetW, targetH);

        const jpegBase64 = canvas.toDataURL('image/jpeg', 0.98);
        const finalJpeg = buildAndInjectEXIF(jpegBase64);

        const stringLength = finalJpeg.length - 'data:image/jpeg;base64,'.length;
        const sizeInMb = ((4 * Math.ceil(stringLength / 3) * 0.5624896334383612) / (1024 * 1024)).toFixed(2);

        bar.style.width = "100%";
        fileSizeTag.innerText = `Rendered: ${targetW}x${targetH} (~${sizeInMb} MB)`;

        downloadBtn.href = finalJpeg;
        downloadBtn.download = `${rawFileName}_ultra_hd.jpg`;
        downloadBtn.classList.remove('hidden');

      } catch (err) {
        console.error(err);
        fileSizeTag.innerText = "Error: Out of browser memory";
      }
    }

    function applySafeSharpness(context, w, h) {
      const imgData = context.getImageData(0, 0, w, h);
      const data = imgData.data, copy = new Uint8ClampedArray(data), w4 = w * 4;

      for (let i = w4 + 4; i < data.length - w4 - 4; i += 4) {
        const centerR = copy[i], centerG = copy[i+1], centerB = copy[i+2];
        const topR = copy[i - w4], leftR = copy[i - 4], rightR = copy[i + 4], bottomR = copy[i + w4];
        const topG = copy[i - w4 + 1], leftG = copy[i - 3], rightG = copy[i + 5], bottomG = copy[i + w4 + 1];
        const topB = copy[i - w4 + 2], leftB = copy[i - 2], rightB = copy[i + 6], bottomB = copy[i + w4 + 2];

        const sharpR = centerR * 4.4 - (topR + leftR + rightR + bottomR) * 0.85;
        const sharpG = centerG * 4.4 - (topG + leftG + rightG + bottomG) * 0.85;
        const sharpB = centerB * 4.4 - (topB + leftB + rightB + bottomB) * 0.85;

        data[i] = Math.min(255, Math.max(0, sharpR));
        data[i+1] = Math.min(255, Math.max(0, sharpG));
        data[i+2] = Math.min(255, Math.max(0, sharpB));
      }
      context.putImageData(imgData, 0, 0);
    }

    function buildAndInjectEXIF(cleanBase64Jpeg) {
      const zer = {}, exif = {};
      const make = document.getElementById('exifMake').value.trim();
      const model = document.getElementById('exifModel').value.trim();
      const artist = document.getElementById('exifArtist').value.trim();
      const software = document.getElementById('exifSoftware').value.trim();
      const dateStr = document.getElementById('exifDate').value.trim();

      if (make) zer[piexif.ImageIFD.Make] = make;
      if (model) zer[piexif.ImageIFD.Model] = model;
      if (software) zer[piexif.ImageIFD.Software] = software;
      if (artist) zer[piexif.ImageIFD.Artist] = artist;

      if (dateStr) {
        exif[piexif.ExifIFD.DateTimeOriginal] = dateStr;
        exif[piexif.ExifIFD.DateTimeDigitized] = dateStr;
      }

      return piexif.insert(piexif.dump({ "0th": zer, "Exif": exif }), cleanBase64Jpeg);
    }
  </script>
</body>
</html>
