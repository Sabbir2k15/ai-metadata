<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraShield Pro - HD Upscale & Anti-AI Engine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Piexifjs for EXIF Injection -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { background: #02040a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
    .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-gradient { background: linear-gradient(135deg, #6366f1, #a855f7); transition: all 0.3s ease; }
    .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4); }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="max-w-4xl w-full mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-5xl font-black bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent">
        AuraShield HD Engine
      </h1>
      <p class="text-slate-400 text-xs md:text-sm mt-2">
        Auto 2x HD Upscaling • Sharp Detail Restoration • 2-5 MB Output Target
      </p>
    </header>

    <!-- Main App Container -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Upload Box & Status -->
      <div class="glass-panel p-6 rounded-3xl flex flex-col justify-between">
        <div>
          <div id="dropzone" class="border-2 border-dashed border-slate-600/80 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer hover:border-cyan-400 transition-all text-center min-h-[200px]">
            <i data-lucide="upload-cloud" class="w-12 h-12 text-cyan-400 mb-3"></i>
            <p class="text-base font-bold text-slate-200">Click or Drag Photo Here</p>
            <p class="text-xs text-slate-400 mt-1">Automatically upscales & sharpens image</p>
            <input type="file" id="fileInput" accept="image/*" class="hidden" />
          </div>

          <!-- Configuration Indicator -->
          <div class="mt-6 space-y-2 text-xs text-slate-400">
            <div class="flex justify-between p-2 rounded-lg bg-slate-800/40">
              <span>Resolution Boost:</span>
              <span class="text-cyan-400 font-bold">2X HD Upscale</span>
            </div>
            <div class="flex justify-between p-2 rounded-lg bg-slate-800/40">
              <span>Output Quality:</span>
              <span class="text-emerald-400 font-bold">0.98 Maximum JPG</span>
            </div>
          </div>
        </div>

        <div class="mt-6 space-y-2">
          <div id="status" class="text-xs font-mono text-slate-400">Status: Ready</div>
          <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 w-0 transition-all duration-300"></div>
          </div>
        </div>
      </div>

      <!-- Preview Box -->
      <div class="glass-panel p-6 rounded-3xl flex flex-col items-center justify-center min-h-[300px]">
        <canvas id="canvas" class="hidden rounded-xl max-w-full h-auto max-h-[350px] shadow-2xl border border-slate-700/50"></canvas>
        
        <div id="placeholder" class="text-slate-500 text-center py-12">
          <i data-lucide="image" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
          <p class="text-sm font-semibold">HD Preview will appear here</p>
        </div>

        <a id="downloadBtn" class="hidden btn-gradient mt-6 w-full py-4 rounded-xl font-bold text-center text-white shadow-lg flex items-center justify-center gap-2">
          <i data-lucide="download" class="w-5 h-5"></i>
          Download HD Photo (.jpg)
        </a>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const downloadBtn = document.getElementById('downloadBtn');
    const progressBar = document.getElementById('progressBar');
    const status = document.getElementById('status');

    dropzone.onclick = () => fileInput.click();
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('border-cyan-400'); };
    dropzone.ondragleave = () => dropzone.classList.remove('border-cyan-400');
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-cyan-400');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    };

    fileInput.onchange = (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    };

    async function handleFile(file) {
      if (!file.type.match('image.*')) return;

      const rawFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "hd_photo";
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();
      
      runHDUpscalePipeline(img, rawFileName);
    }

    async function runHDUpscalePipeline(img, fileName) {
      updateProgress(10, "Cropping 3.5% Boundary...");

      const origW = img.width;
      const origH = img.height;
      const margin = 0.035;

      const cropX = Math.floor(origW * margin);
      const cropY = Math.floor(origH * margin);
      const cropW = origW - (cropX * 2);
      const cropH = origH - (cropY * 2);

      // STEP 1: 2X Resolution Upscaling
      updateProgress(30, "Upscaling 2X Resolution...");
      const upscaleFactor = 2.0; // Multiplies canvas width and height by 2x
      const targetW = Math.floor(cropW * upscaleFactor);
      const targetH = Math.floor(cropH * upscaleFactor);

      canvas.width = targetW;
      canvas.height = targetH;

      // Enable High-Quality Image Smoothing (Bicubic-like interpolator)
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Draw cropped image onto upscaled canvas
      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, targetW, targetH);

      // STEP 2: Sharpening Pass (Removes Blurriness)
      updateProgress(55, "Applying Detail Sharpening Pass...");
      applySharpenMatrix(ctx, targetW, targetH);

      // STEP 3: ISO Sensor Grain (Increases Detail & File Size)
      updateProgress(75, "Injecting ISO Sensor Grain...");
      applySensorGrain(ctx, targetW, targetH);

      // STEP 4: High-Quality Compression (Targeting 2-5 MB)
      updateProgress(90, "Encoding High-Quality JPEG (0.98)...");
      const highQualityJpeg = canvas.toDataURL('image/jpeg', 0.98);

      // STEP 5: EXIF Injection
      const finalImage = injectAutoEXIF(highQualityJpeg);

      // Update UI & Download Button
      downloadBtn.href = finalImage;
      downloadBtn.download = `${fileName}_hd_stealth.jpg`;
      downloadBtn.classList.remove('hidden');
      document.getElementById('placeholder').classList.add('hidden');
      canvas.classList.remove('hidden');
      
      updateProgress(100, "Done! File Upscaled & Ready.");
    }

    function updateProgress(percent, text) {
      progressBar.style.width = `${percent}%`;
      status.innerText = `Status: ${text}`;
    }

    // High-Pass Sharpen Convolution Matrix
    function applySharpenMatrix(context, w, h) {
      const imgData = context.getImageData(0, 0, w, h);
      const data = imgData.data;
      const copy = new Uint8ClampedArray(data);
      const w4 = w * 4;

      for (let i = w4 + 4; i < data.length - w4 - 4; i += 4) {
        for (let j = 0; j < 3; j++) { // Red, Green, Blue
          // Convolution Kernel: Center 5, Surroundings -1
          const sharpVal = copy[i + j] * 5 
            - copy[i - 4 + j] 
            - copy[i + 4 + j] 
            - copy[i - w4 + j] 
            - copy[i + w4 + j];

          data[i + j] = Math.min(255, Math.max(0, sharpVal));
        }
      }
      context.putImageData(imgData, 0, 0);
    }

    // Multi-Channel Sensor Grain (Prevents JPEG Compression, Keeping File Size > 2MB)
    function applySensorGrain(context, w, h) {
      const imgData = context.getImageData(0, 0, w, h);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 6.5;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      context.putImageData(imgData, 0, 0);
    }

    // EXIF Profile Injection (Canon EOS R5)
    function injectAutoEXIF(jpegDataUrl) {
      const zeroth = {};
      const exif = {};

      const now = new Date();
      const dateStr = `${now.getFullYear()}:${String(now.getMonth()+1).padStart(2,'0')}:${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

      zeroth[piexif.ImageIFD.Make] = "Canon";
      zeroth[piexif.ImageIFD.Model] = "Canon EOS R5";
      zeroth[piexif.ImageIFD.Software] = "Digital Photo Professional 4.15";
      
      exif[piexif.ExifIFD.LensModel] = "RF50mm F1.2 L USM";
      exif[piexif.ExifIFD.FNumber] = [14, 10];
      exif[piexif.ExifIFD.ISOSpeedRatings] = 100;
      exif[piexif.ExifIFD.DateTimeOriginal] = dateStr;

      const exifObj = { "0th": zeroth, "Exif": exif };
      const exifBytes = piexif.dump(exifObj);
      return piexif.insert(exifBytes, jpegDataUrl);
    }
  </script>
</body>
</html>
